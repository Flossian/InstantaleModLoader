# 注入せずに確かめられることを、押すたびに全部通す。
#
# ここで走るものは全て `docs/TECH.md` §2「開発の流れ」に載っている手順そのもので、
# 手元で実行するのと同じコマンドを同じ順に呼んでいる。CI 専用の細工は無い。
#
# Windows で走らせているのは、このプロジェクトが Windows 専用だから
# （注入は Win32 API を直接叩く）。Linux で動かすとパス区切りや cp932 まわりの
# 差でしか落ちず、実際の利用環境の情報にならない。
name: CI

# push は main だけを見る。ブランチや fork の head でも走らせると、PR の
# チェック欄に「同じ内容の実行」が2つ並ぶうえ、head 側は main を取り込むまで
# 古い状態のまま走るので、こちらで直した後も赤が残り続ける。
# PR は `refs/pull/N/merge`（head + 最新の main）で検査されるので、
# main を直せば再実行で追いつく。
on:
  push:
    branches: [main]
  pull_request:

# 日本語のログを出すので UTF-8 を強制する。指定しないと Windows ランナーの
# 既定コードページで文字化けし、失敗の内容が読めなくなる。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ------------------------------------------------------------------
  # ゲームに埋まっているのは CPython 3.10。MOD はその中で動くので、
  # 3.11 以降の構文を書くと**注入した瞬間に落ちる**。
  #
  # `tools/check_mods.py` は ast の feature_version で構文だけを見ているが、
  # そこで捕まらないもの（3.11 以降で入った標準ライブラリの関数など）がある。
  # ここは本物の 3.10 を用意して、実際にコンパイルが通るかを確かめる。
  # ------------------------------------------------------------------
  game-python:
    name: 3.10 (ゲーム内で動く部分)
    runs-on: windows-latest
    steps:
      # actions/* は Node 24 で走る版に揃えてある。古い版（checkout@v4 /
      # setup-python@v5）は Node 20 を指しており、ランナーが Node 24 へ
      # 読み替えたうえで非推奨の警告を出す。使っているのは checkout が引数
      # 無し、setup-python が python-version だけなので、上げても呼び方は
      # 変わらない（v7 の非互換は checkout が pull_request_target の fork
      # 取得、setup-python が pip-install の廃止。どちらもここでは使わない）。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # runtime/ だけが対象。tools/ は利用者の Python（3.13）で動くもので、
      # ゲームの中には入らないため 3.10 に縛る必要が無い。
      #
      # `-x` で外しているのは開発中の mod（9xx。TECH.md §2.6）。配布物にも
      # `load_order.json` にも入らないものなので、書きかけの一本でリリースする側の
      # 検査を止めない。除外は**番号帯という決まった形**で、個別の「既知の失敗」
      # 一覧ではない ― リリースするときに正式な番号へ振り直せば自動で対象に戻る。
      # `mods.9..._` の `.` は区切り記号（Windows は \\、それ以外は /）を
      # どちらでも受けるため。
      - name: compileall runtime (3.10)
        run: python -m compileall -q runtime -x "mods.9[0-9][0-9]_"

  # ------------------------------------------------------------------
  # 利用者の環境（3.13）で、静的検査とオフライン検証を通す。
  # ------------------------------------------------------------------
  checks:
    name: 3.13 (静的検査とオフライン検証)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 開発中の mod（9xx）と、その検査（`test_wip_*.py`）は外す。理由は 3.10 の
      # ジョブと同じ。
      - name: compileall
        run: python -m compileall -q runtime tools -x "(mods.9[0-9][0-9]_|test_wip_)"

      # デコレータの対象と引数の食い違い、mod.json の entry、load_order の
      # 突き合わせ。構文が正しくてもゲームを落とすものはここで捕まる。
      # 同梱 MOD は `--strict`（note も失敗に数える。TECH.md §2.3）。手元では
      # load_order.local.json の知らせが note に出るので付けないが、CI の作業ツリーには無い。
      - name: check_mods
        run: python tools/check_mods.py --strict

      # docs\MODS.md と docs\MODLIST.md は生成物（TECH.md §2.7）。DOC.md や
      # mod.json を直して生成し忘れると、配布物の中の説明だけが古いまま通る。
      # 読む人には見分けが付かないので、ここで止める。
      - name: build_mods --check
        run: python tools/build_mods.py --check

      - name: list_mods --check
        run: python tools/list_mods.py --check

      # tools/tests/test_*.py は全てゲーム不要（偽のゲームを差し込んで走る）。
      # **1本でも落ちたら失敗**。除外一覧は置かない ― 一度置くと、そこに
      # 積まれたものが直ったかどうか誰も見なくなる。
      #
      # 出力は捨てずに控え、落ちた本のぶんだけ吐く。落ちるものの中には
      # **手元では再現せずランナーでだけ出るもの**（背景スレッドの待ちが
      # 間に合わない等）があり、名前だけ残しても手掛かりにならない。
      # 通った本は今までどおり1行だけ。
      - name: offline tests
        shell: pwsh
        run: |
          # `test_wip_*.py` は開発中の mod（9xx。TECH.md §2.6）の検査。CI では
          # 走らせないが、**外したことは必ず出す** ― 黙って減らすと「全部通った」
          # と読めてしまう。
          $wip = Get-ChildItem tools/tests/test_wip_*.py -ErrorAction SilentlyContinue |
                 Sort-Object Name
          foreach ($w in $wip) { Write-Host "  skip  $($w.BaseName)  (開発中)" }

          $failed = @()
          foreach ($f in Get-ChildItem tools/tests/test_*.py |
                         Where-Object { $_.Name -notlike 'test_wip_*' } |
                         Sort-Object Name) {
            $out = & python $f.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed += $f.BaseName
              Write-Host "  FAIL  $($f.BaseName)"
              Write-Host "::group::$($f.BaseName) の出力"
              $out | ForEach-Object { Write-Host $_ }
              Write-Host "::endgroup::"
            } else {
              Write-Host "  ok    $($f.BaseName)"
            }
          }
          if ($failed) {
            Write-Host ""
            Write-Host "失敗: $($failed -join ', ')"
            Write-Host "各本の出力は上の折り畳みに入っている。"
            exit 1
          }

  # ------------------------------------------------------------------
  # 配布物が実際に組めること、そして**配れる状態**であることを確かめる。
  # ------------------------------------------------------------------
  packaging:
    name: 配布物のビルド
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # MIT は著作権表示が複製に付いて回ることを要求する。LICENSE の欠けた
      # 状態で公開すると、誰も合法的に再配布できない。
      - name: LICENSE は MIT の原文か
        shell: pwsh
        run: |
          if (-not (Select-String -Path LICENSE -Pattern 'MIT License' -Quiet)) {
            Write-Host "LICENSE が MIT の原文になっていない"
            exit 1
          }
          Write-Host "  ok    LICENSE は MIT の原文"

      - name: make_dist
        shell: cmd
        run: make_dist.bat

      # 配布物に LICENSE / NOTICE が入っていなければ、それは配れない zip。
      # make_dist.bat 自身も欠けていれば止まるが、**組み上がった中身**を
      # 見るのはここだけ。make_dist.bat は「全部の zip に入れる」と言っているので、
      # 3本とも見る（loader 単体・mods 単体の欠けは full を見ても分からない）。
      # 名前は版から組む。手元に古い版の zip が残っていても、そちらを検査しない。
      - name: zip の中身
        shell: pwsh
        run: |
          $ver = (Select-String -Path runtime/instantale_modloader/__init__.py `
                  -Pattern '^__version__\s*=\s*["'']([^"'']+)["'']').Matches[0].Groups[1].Value
          Write-Host "  版 $ver"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # 手元版（`*.default.*` から `.default` を抜いた名前）はどの zip にも入れない。
          # 入ると、更新がその人の書き換えた版を上書きする。
          $userCopies = @(Get-ChildItem runtime/mods -Recurse -File -Filter '*.default.*' |
                          ForEach-Object { $_.Name -replace '\.default\.', '.' } |
                          Sort-Object -Unique)
          # docs\ に在るものは全部配布物に入る。名前を並べて写していた頃、
          # 足した文書が並びから漏れても誰も気付かなかった（VERIFICATION_LOG.md）。
          $docs = @(Get-ChildItem docs/*.md | Sort-Object Name | ForEach-Object { "docs/$($_.Name)" })
          $loader = @('LICENSE', 'NOTICE', 'InstantaleModLoader.bat', 'tools/gui.py',
                      'runtime/instantale_modloader/__init__.py',
                      'runtime/mods/_template/mod.json') + $docs
          $packages = @(
            @{ zip = "InstantaleModLoader-$ver-full.zip"; mods = 'runtime/mods/'
               want = $loader + @('runtime/mods/load_order.json'); deny = @() },
            @{ zip = "InstantaleModLoader-$ver.zip"; mods = $null
               want = $loader; deny = @('runtime/mods/load_order.json') },
            @{ zip = "InstantaleMods-$ver.zip"; mods = ''
               want = @('LICENSE', 'NOTICE'); deny = @('load_order.json', '_template/mod.json') }
          )

          $bad = 0
          foreach ($p in $packages) {
            $path = Join-Path dist $p.zip
            if (-not (Test-Path $path)) { Write-Host "  $($p.zip) が作られていない"; $bad++; continue }
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path).Path)
            try { $names = @($archive.Entries | ForEach-Object { $_.FullName }) }
            finally { $archive.Dispose() }
            Write-Host "  $($p.zip)  $($names.Count) ファイル / $([math]::Round((Get-Item $path).Length/1KB)) KB"
            # 区切りは "/"（make_dist.bat の :zip）。"\" で書くと読めない展開ソフトがある。
            $backslash = @($names | Where-Object { $_.Contains('\') })
            if ($backslash) { Write-Host "    区切りが \ の項目: $($backslash[0])"; $bad++ }
            # 先頭の一段（包みのフォルダ）を剥がした相対パスで見る。
            $rel = @($names | ForEach-Object { ($_ -split '/', 2)[-1] })
            foreach ($want in $p.want) {
              if ($rel -notcontains $want) { Write-Host "    入っていない: $want"; $bad++ }
            }
            foreach ($deny in $p.deny) {
              if ($rel -contains $deny) { Write-Host "    入っている: $deny"; $bad++ }
            }
            foreach ($leak in @($rel | Where-Object { $userCopies -contains ($_ -split '/')[-1] })) {
              Write-Host "    手元版が入っている: $leak"; $bad++
            }
            if ($null -ne $p.mods) {
              $pattern = '^' + [regex]::Escape($p.mods) + '[^/_][^/]*/mod\.json$'
              $count = @($rel | Where-Object { $_ -match $pattern }).Count
              if ($count -eq 0) { Write-Host "    MOD が1本も入っていない"; $bad++ }
              else { Write-Host "    MOD $count 本" }
            }
          }
          if ($bad) { exit 1 }
          Write-Host "  ok    3本とも中身が揃っている"

      # 配った tools が配布物の中で動くか。一覧（make_dist.bat）は許可制なので、
      # 配ったファイルが読む tools\ のモジュールを入れ忘れると、配布物でだけ
      # ImportError になる（リポジトリと上の検査では通ってしまう）。
      # 同梱 MOD は `check_mods.py --strict` を通す（TECH.md §2.3）。展開した full で
      # 走らせるので、make_dist.bat が落とした MOD と load_order.json の食い違いもここで出る。
      - name: 展開した配布物で tools を読み込む
        shell: pwsh
        run: |
          $ver = (Select-String -Path runtime/instantale_modloader/__init__.py `
                  -Pattern '^__version__\s*=\s*["'']([^"'']+)["'']').Matches[0].Groups[1].Value
          $dest = Join-Path ([IO.Path]::GetTempPath()) "instantale-dist-$ver"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path "dist/InstantaleModLoader-$ver-full.zip" -DestinationPath $dest
          $root = Join-Path $dest "InstantaleModLoader-$ver"

          $failed = @()
          Push-Location (Join-Path $root 'tools')
          try {
            foreach ($py in Get-ChildItem *.py | Sort-Object Name) {
              $out = & python -c "import $($py.BaseName)" 2>&1
              if ($LASTEXITCODE -ne 0) {
                $failed += "import $($py.BaseName)"
                Write-Host "  FAIL  import $($py.BaseName)"
                $out | ForEach-Object { Write-Host "        $_" }
              } else {
                Write-Host "  ok    import $($py.BaseName)"
              }
            }
          } finally { Pop-Location }

          Push-Location $root
          try {
            & python tools/check_mods.py --strict
            if ($LASTEXITCODE -ne 0) { $failed += 'check_mods.py --strict' }
          } finally { Pop-Location }

          if ($failed) {
            Write-Host ""
            Write-Host "失敗: $($failed -join ', ')"
            exit 1
          }
